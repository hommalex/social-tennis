<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player Setup — NTC Social Tennis</title>
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./assets/css/mystyle.css">
    <style>
        body { padding-bottom: 5rem; }
        .row-player { border-bottom: 1px solid #eee; padding: .45rem .25rem; }
        .row-player.done { background: #f4fbf5; }
        .row-player.todo { background: #fffdf3; }
        .name { font-size: .95rem; }
        .btn-group-xs .btn { padding: .1rem .45rem; font-size: .8rem; }
        .sticky-bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 2px solid #0d6efd; }
        .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 2px solid #198754; padding: .6rem; z-index: 20; }
    </style>
</head>
<body>
<div id="app" class="container py-3" style="max-width: 780px;">

    <div v-if="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2 text-muted">Loading players…</p>
    </div>

    <template v-else>
        <div class="sticky-bar pt-2 pb-2 mb-2">
            <h4 class="text-primary mb-1">Player Setup</h4>
            <p class="small text-muted mb-2">
                Set gender and class for each player, then save. Temporary page — delete it when you're done.
            </p>
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <div class="btn-group btn-group-sm">
                    <button class="btn" :class="filter==='todo'?'btn-warning':'btn-outline-warning'" @click="setFilter('todo')">
                        Needs setup ({{ counts.todo }})
                    </button>
                    <button class="btn" :class="filter==='done'?'btn-success':'btn-outline-success'" @click="setFilter('done')">
                        Done ({{ counts.done }})
                    </button>
                    <button class="btn" :class="filter==='all'?'btn-primary':'btn-outline-primary'" @click="setFilter('all')">
                        All ({{ players.length }})
                    </button>
                </div>
                <input class="form-control form-control-sm" style="max-width: 200px;"
                       placeholder="Search name…" v-model="search">
            </div>
            <div class="progress mt-2" style="height: 6px;">
                <div class="progress-bar bg-success" :style="{width: pct + '%'}"></div>
            </div>
        </div>

        <div v-if="!visible.length" class="text-muted fst-italic py-4 text-center">
            Nothing here. <span v-if="filter==='todo'">Everyone is set up.</span>
        </div>

        <div v-for="p in visible" :key="p.id" class="row-player d-flex align-items-center justify-content-between"
             :class="isDone(p) ? 'done' : 'todo'">
            <div class="name text-truncate me-2" :title="p.name">
                <i v-if="p.gender === 'Female'" class="bi bi-gender-female text-danger"></i>
                <i v-else-if="p.gender === 'Male'" class="bi bi-gender-male text-primary"></i>
                <i v-else class="bi bi-question-circle text-muted"></i>
                {{ p.name }}
            </div>
            <div class="d-flex gap-1 flex-shrink-0">
                <div class="btn-group btn-group-xs" role="group">
                    <button class="btn" :class="p.gender==='Male'?'btn-primary':'btn-outline-secondary'"
                            @click="setGender(p,'Male')">M</button>
                    <button class="btn" :class="p.gender==='Female'?'btn-danger':'btn-outline-secondary'"
                            @click="setGender(p,'Female')">F</button>
                </div>
                <div class="btn-group btn-group-xs" role="group">
                    <button class="btn" :class="p.level==='A'?'btn-success':'btn-outline-secondary'"
                            @click="setLevel(p,'A')">A</button>
                    <button class="btn" :class="p.level==='B'?'btn-info':'btn-outline-secondary'"
                            @click="setLevel(p,'B')">B</button>
                    <button class="btn" :class="p.level==='C'?'btn-secondary':'btn-outline-secondary'"
                            @click="setLevel(p,'C')">C</button>
                </div>
            </div>
        </div>

        <div class="save-bar d-flex align-items-center justify-content-between">
            <div class="small">
                <span :class="dirty ? 'text-danger fw-bold' : 'text-muted'">
                    {{ dirty ? dirty + ' unsaved change(s)' : 'No unsaved changes' }}
                </span>
                <span class="text-muted"> · {{ counts.done }}/{{ players.length }} complete</span>
            </div>
            <div>
                <span v-if="saveMsg" class="me-2 small" :class="saveErr ? 'text-danger' : 'text-success'">{{ saveMsg }}</span>
                <button class="btn btn-success" :disabled="!dirty || saving" @click="save">
                    <span v-if="saving" class="spinner-border spinner-border-sm me-1"></span>
                    <i v-else class="bi bi-cloud-arrow-up"></i> Save to cloud
                </button>
            </div>
        </div>
    </template>
</div>

<script src="./assets/js/vue3.js"></script>
<script>
const API = {
    endpoint: 'https://api.jsonbin.io/v3/b/',
    binId: '6970c321d0ea881f407a7bab',
    apiKey: '$2a$10$8czTg3UoYIs/26B9Scbo3OkkGrZz4ZZwfrNUl./r65HzhLfzw2YU2'
};

Vue.createApp({
    setup() {
        const { ref, computed, onMounted } = Vue;

        const loading = ref(true);
        const saving = ref(false);
        const saveMsg = ref('');
        const saveErr = ref(false);
        const players = ref([]);
        const record = ref(null);
        const filter = ref('todo');
        const search = ref('');
        const dirty = ref(0);
        // Rows must not disappear the instant they are completed, or the list jumps
        // under your thumb mid-tap. The "needs setup" list is frozen until you
        // switch filter or save.
        const todoFrozen = ref(new Set());

        const isDone = (p) => !!p.gender && !!p.level;

        const counts = computed(() => ({
            done: players.value.filter(isDone).length,
            todo: players.value.filter(p => !isDone(p)).length
        }));

        const pct = computed(() => players.value.length
            ? Math.round(counts.value.done / players.value.length * 100) : 0);

        const visible = computed(() => {
            let list = players.value;
            if (filter.value === 'todo') list = list.filter(p => todoFrozen.value.has(p.id));
            if (filter.value === 'done') list = list.filter(isDone);
            const q = search.value.trim().toLowerCase();
            if (q) list = list.filter(p => (p.name || '').toLowerCase().includes(q));
            return list;
        });

        const refreshTodo = () => {
            todoFrozen.value = new Set(players.value.filter(p => !isDone(p)).map(p => p.id));
        };

        const setFilter = (f) => {
            if (f === 'todo') refreshTodo();
            filter.value = f;
        };

        const setGender = (p, g) => { if (p.gender !== g) { p.gender = g; dirty.value++; } };
        const setLevel  = (p, l) => { if (p.level  !== l) { p.level  = l; dirty.value++; } };

        const load = async () => {
            try {
                const res = await fetch(`${API.endpoint}${API.binId}/latest`, {
                    headers: { 'X-Master-Key': API.apiKey }
                });
                const data = await res.json();
                record.value = data.record;
                players.value = (data.record.players || [])
                    .slice()
                    .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                refreshTodo();
            } catch (e) {
                alert('Could not load players: ' + e.message);
            } finally {
                loading.value = false;
            }
        };

        const save = async () => {
            saving.value = true; saveMsg.value = ''; saveErr.value = false;
            try {
                // Re-read first so a session running in the other tab is not clobbered.
                const fresh = await fetch(`${API.endpoint}${API.binId}/latest`, {
                    headers: { 'X-Master-Key': API.apiKey }
                }).then(r => r.json());

                const edits = new Map(players.value.map(p => [p.id, p]));
                const merged = (fresh.record.players || []).map(p => {
                    const e = edits.get(p.id);
                    if (!e) return p;
                    const out = { ...p };
                    if (e.gender) out.gender = e.gender;
                    if (e.level) out.level = e.level;
                    return out;
                });

                const payload = { ...fresh.record, players: merged,
                                  last_update: new Date().toISOString().split('T')[0] };

                const res = await fetch(`${API.endpoint}${API.binId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API.apiKey },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);

                dirty.value = 0;
                refreshTodo();
                saveMsg.value = 'Saved';
                setTimeout(() => saveMsg.value = '', 2500);
            } catch (e) {
                saveErr.value = true;
                saveMsg.value = 'Save failed: ' + e.message;
            } finally {
                saving.value = false;
            }
        };

        // Don't lose 15 minutes of tapping to an accidental refresh.
        window.addEventListener('beforeunload', (e) => {
            if (dirty.value) { e.preventDefault(); e.returnValue = ''; }
        });

        onMounted(load);

        return { loading, saving, saveMsg, saveErr, players, filter, search, dirty,
                 counts, pct, visible, isDone, setGender, setLevel, save, setFilter };
    }
}).mount('#app');
</script>
</body>
</html>
